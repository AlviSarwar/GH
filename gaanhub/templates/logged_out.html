{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged out — GaanHub</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { margin: 0; background: #121212; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .logout-box {
            text-align: center;
            padding: 48px 40px;
            background: #181818;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #282828;
        }
        .logout-icon { font-size: 56px; margin-bottom: 20px; }
        .logout-title { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 10px; }
        .logout-sub { font-size: 14px; color: #B3B3B3; line-height: 1.6; margin-bottom: 32px; }
        .actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-green {
            display: block;
            background: #1DB954;
            color: #000;
            font-weight: 700;
            font-size: 14px;
            padding: 14px;
            border-radius: 50px;
            text-decoration: none;
            transition: background .15s;
        }
        .btn-green:hover { background: #1ed760; color: #000; }
        .btn-white {
            display: block;
            background: transparent;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            padding: 13px;
            border-radius: 50px;
            border: 2px solid #fff;
            text-decoration: none;
            transition: background .15s;
        }
        .btn-white:hover { background: rgba(255,255,255,.1); }
        .divider {
            color: #535353;
            font-size: 12px;
            margin: 4px 0;
        }
    </style>
</head>
<body>
<div class="logout-box">
    <div class="logout-icon">👋</div>
    <h1 class="logout-title">See you soon!</h1>
    <p class="logout-sub">You've been logged out of GaanHub. Your music will be waiting for you when you come back.</p>
    <div class="actions">
        <a href="{% url 'login' %}" class="btn-green">Log back in</a>
        <p class="divider">or</p>
        <a href="{% url 'users:register' %}" class="btn-white">Create a new account</a>
        <a href="{% url 'landing' %}" style="color:#B3B3B3;font-size:13px;margin-top:8px;">← Back to home</a>
    </div>
</div>
</body>
</html>
