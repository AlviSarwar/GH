{% extends 'base.html' %}
{% block title %}Change Password — GaanHub{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">🔒 Change Password</h1>
    <p class="page-sub">Keep your account secure</p>
</div>

{% if messages %}
<div class="messages">
    {% for msg in messages %}
    <div class="msg msg-{{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
</div>
{% endif %}

<div class="form-card" style="max-width:460px">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" name="old_password" class="form-input" required placeholder="Enter current password">
        </div>
        <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password1" class="form-input" required placeholder="At least 8 characters">
        </div>
        <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="new_password2" class="form-input" required placeholder="Repeat new password">
        </div>
        <div style="display:flex;gap:12px;margin-top:24px">
            <button type="submit" class="btn-primary">Update Password</button>
            <a href="{% url 'music:my_profile' %}" class="btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
